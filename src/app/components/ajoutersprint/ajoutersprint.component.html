<div class="container">
  <h2 class="mb-4">Add Sprint</h2>
  <div class="card mb-4">
    <div class="card-body">
      <form [formGroup]="sprintForm" (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label for="originBoardId">Origin Board ID:</label>
          <input type="number" formControlName="originBoardId" class="form-control" required>
          <div *ngIf="sprintForm.get('originBoardId')?.hasError('required') && sprintForm.get('originBoardId')?.touched" class="text-danger">
            Origin Board ID is required.
          </div>
        </div>
        <div class="form-group">
          <label for="name">Sprint Name:</label>
          <input type="text" formControlName="name" class="form-control" required>
          <div *ngIf="sprintForm.get('name')?.hasError('required') && sprintForm.get('name')?.touched" class="text-danger">
            Sprint Name is required.
          </div>
        </div>
        <div class="form-group">
          <label for="startDate">Start Date:</label>
          <input type="date" formControlName="startDate" class="form-control" required>
          <div *ngIf="sprintForm.get('startDate')?.hasError('required') && sprintForm.get('startDate')?.touched" class="text-danger">
            Start Date is required.
          </div>
        </div>
        <div class="form-group">
          <label for="goal">Goal:</label>
          <textarea formControlName="goal" class="form-control" required></textarea>
          <div *ngIf="sprintForm.get('goal')?.hasError('required') && sprintForm.get('goal')?.touched" class="text-danger">
            Goal is required.
          </div>
        </div>
        <div class="form-group">
          <label for="state">State:</label>
          <select formControlName="state" class="form-control" required>
            <option value="active">Active</option>
            <option value="future">Future</option>
          </select>
          <div *ngIf="sprintForm.get('state')?.hasError('required') && sprintForm.get('state')?.touched" class="text-danger">
            State is required.
          </div>
        </div>
        <div class="form-group">
          <label for="endDate">End Date:</label>
          <input type="date" formControlName="endDate" class="form-control" required>
          <div *ngIf="sprintForm.get('endDate')?.hasError('required') && sprintForm.get('endDate')?.touched" class="text-danger">
            End Date is required.
          </div>
        </div>
        <button type="submit" class="btn btn-rounded btn-primary m-2 col-md-3" [disabled]="sprintForm.invalid">Create Sprint</button>
        <button class="btn btn-rounded btn-light m-2 col-md-2 me-2" routerLink="/affichersprints">Return to sprint list</button>
      </form>
    </div>
  </div>
</div>
