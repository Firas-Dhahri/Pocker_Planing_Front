<div class="container">
  <h2 class="mb-4 mt-4">Update Sprint</h2>
  <div class="card">
    <div class="card-body">
      <form [formGroup]="sprintForm" (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label for="originBoardId">Origin Board ID:</label>
          <input type="number" formControlName="originBoardId" class="form-control">
        </div>
        <div class="form-group">
          <label for="name">Sprint Name:</label>
          <input type="text" formControlName="name" class="form-control">
        </div>
        <div class="form-group">
          <label for="startDate">Start Date:</label>
          <input type="date" formControlName="startDate" class="form-control">
        </div>
        <div class="form-group">
          <label for="goal">Goal:</label>
          <textarea formControlName="goal" class="form-control"></textarea>
        </div>
        <div class="form-group">
          <label for="state">State:</label>
          <select formControlName="state" class="form-control">
            <option value="active">Active</option>
            <option value="future">Future</option>
          </select>
        </div>
        <div class="form-group">
          <label for="endDate">End Date:</label>
          <input type="date" formControlName="endDate" class="form-control">
        </div>
        <div class="row">
          <div class="col-md-2">
            <button class="btn btn-rounded btn-light col-md-12 mb-2" routerLink="/affichersprints">Return to sprint list</button>
          </div>
          <div class="col-md-3">
            <button type="submit" class="btn btn-rounded btn-primary col-md-12">Update Sprint</button>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>
